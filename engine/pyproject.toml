[project]
name = "atlas"
version = "0.1.0"
description = "Grounded business-context catalogue generator for unfamiliar database schemas"
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.3.0",
    "fastapi>=0.141.1",
    "openai>=2.50.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    # The `secure-local-storage` extra is what installs `keyring`, and keyring
    # is what lets the connector persist the MFA token it is already asking
    # for via `client_request_mfa_token`. Without it a TOTP login authenticates
    # once and nothing survives: the stored credential carries no passcode, so
    # every later connection is refused for want of a code no background job
    # can supply.
    "snowflake-connector-python[secure-local-storage]>=3.12",
    "snowflake-sqlalchemy>=1.11.0",
    "sqlalchemy>=2.0",
    "typer>=0.15",
    "uvicorn>=0.52.0",
]

[project.scripts]
atlas = "atlas.cli:app"

# Type checking. This section is also what anchors the project root at
# `engine/` for an editor's language server: basedpyright walks up from the
# file being edited, finds this, and picks up `engine/.venv` beside it. Without
# it every third-party import resolves against the system Python and reports
# missing, however the editor is opened.
[tool.basedpyright]
include = ["src", "tests"]
exclude = ["out"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
# Tests that execute generated SQL against a real PostgreSQL. Deselected by
# default so the everyday loop needs no database; `make engine-test-postgres`
# starts one and runs them.
markers = [
    "postgres: requires a live PostgreSQL at ATLAS_TEST_DATABASE_URL",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
